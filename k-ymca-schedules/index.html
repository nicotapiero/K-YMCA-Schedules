<!DOCTYPE HTML>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta charset="utf-8">

  <title>YMCA Schedules</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .btn {
      width: 85%;
      padding: 20px;
      margin: 12px auto;
      font-size: 20px;
      border: 2px solid black;
      border-radius: 12px;
      background: white;
    }

    #status {
      margin-top: 20px;
      font-size: 14px;
    }
  </style>

  <script src="main.js"></script>
</head>

<body onload="init()">

  <h1>YMCA Schedules</h1>

  <button class="btn" onclick="openSchedule('group')">Group Exercise</button>
  <button class="btn" onclick="openSchedule('pool')">Pool Schedule</button>
  <button class="btn" onclick="openSchedule('basketball')">Basketball Courts</button>

  <p id="status">Loading schedules...</p>

</body>

</html>
